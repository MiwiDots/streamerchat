<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1f1a3a"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </radialGradient>
    <linearGradient id="tw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a970ff"/>
      <stop offset="100%" stop-color="#7a3df2"/>
    </linearGradient>
    <linearGradient id="yt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="kk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eff3e"/>
      <stop offset="100%" stop-color="#3acc10"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- background plate with rounded corners -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <!-- subtle inner glow ring -->
  <circle cx="512" cy="480" r="380" fill="none" stroke="#9146ff" stroke-width="2" opacity="0.18"/>

  <!-- Three chat bubbles in a triangular hub arrangement -->
  <!-- Bubble 1 (top-left, Twitch purple) -->
  <g filter="url(#glow)" transform="translate(280 280)">
    <path d="M0,80 Q0,0 80,0 L260,0 Q340,0 340,80 L340,200 Q340,280 260,280 L120,280 L60,340 L80,280 Q0,280 0,200 Z"
          fill="url(#tw)"/>
  </g>
  <!-- Bubble 2 (top-right, YouTube red) -->
  <g filter="url(#glow)" transform="translate(440 200)">
    <path d="M0,80 Q0,0 80,0 L240,0 Q320,0 320,80 L320,180 Q320,260 240,260 L120,260 L60,320 L80,260 Q0,260 0,180 Z"
          fill="url(#yt)"/>
  </g>
  <!-- Bubble 3 (bottom-center, Kick green) -->
  <g filter="url(#glow)" transform="translate(320 480)">
    <path d="M0,80 Q0,0 80,0 L300,0 Q380,0 380,80 L380,220 Q380,300 300,300 L160,300 L100,360 L120,300 Q0,300 0,220 Z"
          fill="url(#kk)"/>
  </g>

  <!-- Central hub dot -->
  <circle cx="512" cy="500" r="34" fill="#ffffff" opacity="0.95"/>
  <circle cx="512" cy="500" r="48" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
</svg>
