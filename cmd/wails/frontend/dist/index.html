<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamerChat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="titlebar">
    <span class="title-text">StreamerChat</span>
    <span class="status-pills" id="statusPills">
      <span class="pill pill-tw">TW:●</span>
      <span class="pill pill-yt hidden" id="ytPill">YT:●</span>
    </span>
    <span class="titlebar-spacer"></span>
    <button class="win-btn" id="settingsBtn" title="Settings">&#9881;</button>
    <div class="window-controls">
      <button class="win-btn" id="winMinBtn" title="Minimize">&minus;</button>
      <button class="win-btn" id="winMaxBtn" title="Maximize">&#9633;</button>
      <button class="win-btn win-close" id="winCloseBtn" title="Close">&times;</button>
    </div>
  </div>
  <div class="update-banner hidden" id="updateBanner">
    <span class="update-text" id="updateText"></span>
    <button class="btn btn-primary" id="updateInstallBtn">Install</button>
    <button class="btn" id="updateDismissBtn">Later</button>
  </div>
  <div class="main">
    <div class="panel chat-panel">
      <div class="scroll" id="chat"></div>
    </div>
    <div class="panel sidebar">
      <div class="panel-title sidebar-title" id="userTitle">Users (0)</div>
      <div class="scroll" id="userList"></div>
    </div>
  </div>
  <div class="input-row">
    <span class="input-label" id="inputLabel">TW &gt;</span>
    <input class="input-field" id="msgInput" type="text" placeholder="Type a message... (F2 to switch target, Esc to close modal)" autocomplete="off">
  </div>
  <div class="status-bar">
    <span id="footer">Press F2 to cycle send target  |  Click user for mod actions</span>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg hidden" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span id="modalUser"></span>
      <span class="modal-close" id="modalClose">✕</span>
    </div>
    <div class="modal-info" id="modalInfo">Loading...</div>
    <div class="modal-btns">
      <button class="btn btn-danger" data-action="ban">Ban</button>
      <button class="btn" data-action="timeout_600">10m</button>
      <button class="btn" data-action="timeout_3600">1h</button>
      <button class="btn" data-action="timeout_86400">24h</button>
      <button class="btn" data-action="delete">Delete</button>
      <button class="btn" data-action="unban">Unban</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-bg hidden" id="settingsModalBg">
  <div class="modal">
    <div class="modal-header">
      <span>Settings</span>
      <span class="modal-close" id="settingsClose">✕</span>
    </div>
    <div class="settings-section">
      <label>Version</label>
      <div class="settings-row">
        <span id="settingsVersion">…</span>
      </div>
    </div>
    <div class="settings-section">
      <label>Updates</label>
      <div class="settings-row">
        <button class="btn" id="checkUpdateBtn">Check for updates</button>
        <span id="updateStatus" class="settings-status"></span>
      </div>
      <div class="settings-row hidden" id="updateApplyRow">
        <button class="btn btn-primary" id="applyUpdateBtn">Install update</button>
      </div>
    </div>
    <div class="settings-section">
      <label>Display</label>
      <label class="checkbox-row">
        <input type="checkbox" id="showTimestampsCheckbox" checked>
        <span>Show timestamps</span>
      </label>
    </div>
    <div class="settings-section">
      <label>YouTube</label>
      <div class="settings-row">
        <label class="checkbox-row">
          <input type="checkbox" id="ytEnabledCheckbox">
          <span>Enable YouTube live-chat overlay</span>
        </label>
      </div>
      <div class="settings-row">
        <input class="modal-input" id="ytHandleInput" type="text" placeholder="@yourchannel" autocomplete="off">
        <button class="btn" id="ytSaveBtn">Save</button>
      </div>
      <div class="settings-row">
        <span id="ytStatus" class="settings-status">Read-only, no login needed. App polls /live every 30s and attaches automatically when you go live.</span>
      </div>
    </div>
    <div class="settings-section">
      <label>Twitch Login</label>
      <div class="settings-row">
        <span id="authInfo">Not logged in</span>
        <button class="btn btn-primary" id="loginBtn">Login</button>
        <button class="btn hidden" id="logoutBtn">Logout</button>
      </div>
      <div class="auth-help hidden" id="authHelp">
        <p>1. Go to <span class="code" id="authUrl"></span></p>
        <p>2. Enter code: <span class="code big" id="authCode"></span></p>
        <p class="hint">Waiting for authorization…</p>
      </div>
    </div>
    <div class="settings-section hidden" id="autostartSection">
      <label class="checkbox-row">
        <input type="checkbox" id="autostartCheckbox">
        <span>Start StreamerChat automatically with Windows</span>
      </label>
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" id="settingsDone">Done</button>
    </div>
  </div>
</div>

<script src="/wails/runtime/runtime.js"></script>
<script src="app.js"></script>
</body>
</html>
